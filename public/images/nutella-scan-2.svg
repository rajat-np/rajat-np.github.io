<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="560" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />

  <text x="140" y="170" font-family="Inter, Arial, sans-serif" font-size="34" fill="#0f172a" font-weight="700">Ecological Impact Details</text>
  <text x="140" y="215" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Signals derived from public product metadata</text>

  <rect x="140" y="260" width="460" height="300" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <text x="170" y="305" font-family="Inter, Arial, sans-serif" font-size="20" fill="#0f172a">Indicators</text>
  <text x="170" y="345" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">• Green-Score: E (needs improvement)</text>
  <text x="170" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">• Nutri-Score: D</text>
  <text x="170" y="415" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">• NOVA: 4 (ultra-processed)</text>
  <text x="170" y="450" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">• Packaging: mixed materials</text>
  <text x="170" y="485" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">• Palm oil: listed in ingredients</text>

  <rect x="640" y="260" width="420" height="300" rx="18" fill="#ecfdf3" stroke="#86efac" stroke-width="2" />
  <text x="670" y="305" font-family="Inter, Arial, sans-serif" font-size="20" fill="#166534">Opportunities</text>
  <text x="670" y="345" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">• Improve sourcing transparency</text>
  <text x="670" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">• Shift to recyclable packaging</text>
  <text x="670" y="415" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">• Reduce processing footprint</text>
  <text x="670" y="450" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">• Add verified eco-labels</text>
</svg>
